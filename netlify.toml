# Netlify detects Next.js and deploys it with its OpenNext-based runtime
# (pages and route handlers become Netlify Functions).
[build]
  command = "bash scripts/netlify-build.sh"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# Pinned so API/CLI-created sites get the runtime too (the UI adds it automatically).
[[plugins]]
  package = "@netlify/plugin-nextjs"
